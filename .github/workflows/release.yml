name: release

# Publishes the terminal client as statically linked `timetrack` binaries
# plus the desktop GUI as a self-contained AppImage bundling
# `timetrack-gui` and `timetrack-service` (see build-appimage.sh).
#
# Every run mints its own version: `version` takes the greater of the
# workspace manifest and the latest `v*` tag, patch-bumping when the
# manifest is not ahead, and each build job mints that version into its own
# checkout before compiling. Ordinary runs only ever move the patch; a
# manually bumped minor or major in Cargo.toml ships as-is. The tag is
# pushed only by `publish`, after the builds pass, so a failed run leaves
# no tag behind -- and nothing is ever committed back: branch protection
# takes the five checks on every `main` commit, and a bot-pushed bump would
# have none.
#
# `workflow_dispatch` runs the same build and the same verification with
# `dry_run` on by default: the artifacts land as run artifacts and no tag
# or release is created, which is how the packaging path can be checked
# without cutting a version. Real releases cut from `main` only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the artifacts, but publish no release
        type: boolean
        default: true

# One release at a time: versions come from the latest tag, so two runs
# computing at once would mint the same one and the loser's tag push would
# fail after building everything. Queued runs see the earlier run's tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GUI_LIBS: libxkbcommon-dev libxkbcommon-x11-dev libfreetype-dev libfontconfig-dev

jobs:
  # ci.yml is the single definition of what "green" means, so nothing
  # publishes a tree that rustfmt, clippy, the tests, the e2e rig or the GUI
  # smoke check reject.
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  # Compute this run's version. Tag history is needed, so this is the one
  # checkout that takes the full clone.
  version:
    name: version
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.mint.outputs.version }}
      tag: ${{ steps.mint.outputs.tag }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Refuse real releases off main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::real releases cut from main only; dispatch with dry_run on other branches"
          exit 1
      - id: mint
        name: Compute the next version
        run: |
          VERSION="$(./scripts/mint-version.sh --next)"
          echo "next release: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `linker-env` is a shell statement, empty where the host linker will
          # do: rustc links musl targets with the host `cc` plus its own musl crt
          # and libc, which cannot work when the objects are another
          # architecture's, so the aarch64 build drives the link with the cross
          # gcc. That is not the musl-gcc override .cargo/config.toml warns
          # about: this one only chooses the link driver, while rustc still
          # supplies its own musl crt objects and libc. `emulator` runs the
          # cross-compiled binary in the verification step, rather than
          # depending on the runner's binfmt registration.
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            packages: musl-tools
            linker-env: ""
            emulator: ""
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            packages: musl-tools gcc-aarch64-linux-gnu qemu-user-static
            linker-env: export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
            emulator: qemu-aarch64-static

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # The tree at the tag still carries the previous version (the bump is
      # never committed back), so each build job mints locally. Minting is a
      # pure function of the version, and `--locked` below proves the lock
      # agrees -- a bad mint fails the build, not the release.
      - name: Mint the release version
        run: ./scripts/mint-version.sh ${{ needs.version.outputs.version }}

      # `musl-tools` is the Debian/Ubuntu package name for the musl cross
      # toolchain; the aarch64 build needs its cross gcc as well. Deliberately
      # NO CARGO_TARGET_*_MUSL_LINKER override to musl-gcc: some distros' musl-gcc
      # (GCC 16.x on Arch as of 2026-09) produces binaries that segfault on
      # anything that hashes -- std's HashMap, and therefore zbus' D-Bus
      # address parser. See .cargo/config.toml.
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ matrix.packages }}
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          ${{ matrix.linker-env }}
          cargo build --release --locked \
            --package timetrack-cli \
            --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/timetrack dist/timetrack-${{ matrix.arch }}
          tar -czf dist/timetrack-${{ matrix.arch }}.tar.gz -C dist timetrack-${{ matrix.arch }}
          rm dist/timetrack-${{ matrix.arch }}

      # Unpacked first, because the tarball is what a downloader gets: a
      # passing check on a loose copy in the workspace would not be evidence
      # about the file on the release page.
      - name: Verify the tarball holds a static binary that actually runs
        run: |
          mkdir -p verify
          tar -xzf dist/timetrack-${{ matrix.arch }}.tar.gz -C verify
          BIN=verify/timetrack-${{ matrix.arch }}
          file "$BIN"
          # Zero NEEDED entries is what "static" means in practice.
          test "$(readelf -d "$BIN" | grep -c NEEDED)" = "0" \
            || { echo "::error::binary is dynamically linked"; exit 1; }
          # And it must not just link -- it must run. A broken linker can
          # produce a binary that segfaults immediately; `--version` touches
          # argument parsing and the hash map that zbus needs.
          ${{ matrix.emulator }} "$BIN" --version
          rm -rf verify

      - uses: actions/upload-artifact@v4
        with:
          name: timetrack-${{ matrix.arch }}
          path: dist/timetrack-${{ matrix.arch }}.tar.gz

  appimage:
    name: TimeTrack-x86_64.AppImage
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # Same local mint as the tarball builds: the image must report the
      # version its tag names, or the self-updater would offer it as an
      # update to itself.
      - name: Mint the release version
        run: ./scripts/mint-version.sh ${{ needs.version.outputs.version }}
      # linuxdeploy bundles these from the build host into the image, but
      # building the GUI still needs their headers, same as the test job.
      # `zsync` is for the delta-update file appimagetool writes next to the
      # image (see build-appimage.sh): without it the update information is
      # still embedded, but no `.zsync` is generated.
      - uses: ./.github/actions/setup
        with:
          apt-packages: ${{ env.GUI_LIBS }} file zsync
      - name: Build the AppImage
        run: ./build-appimage.sh
      - name: Verify the AppImage bundles both binaries
        run: |
          ./TimeTrack-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/timetrack-gui
          test -x squashfs-root/usr/bin/timetrack-service
          test -x squashfs-root/AppRun
          rm -rf squashfs-root
      # The zsync file is what AppImageUpdate downloads instead of the whole
      # image, and the in-app updater's asset pick assumes a published image
      # per architecture. A missing one fails the release, not silently.
      - name: Verify the delta-update file and embedded update information
        run: |
          test -f TimeTrack-x86_64.AppImage.zsync
          strings TimeTrack-x86_64.AppImage \
            | grep -F 'gh-releases-zsync|sequ-r|timetrack|latest|TimeTrack-*x86_64.AppImage.zsync'
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTrack-x86_64.AppImage
          path: |
            TimeTrack-x86_64.AppImage
            TimeTrack-x86_64.AppImage.zsync

  # One job publishes, and it runs only once both builds have finished. Two
  # publishing jobs each generate the release notes and each write their own
  # SHA256SUMS, which is how v0.1.0 came out with its notes printed twice and a
  # checksum file listing one of the two tarballs. A dry run stops before the
  # last step and keeps exactly the files a release would carry.
  publish:
    name: publish
    needs: [build, appimage, version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write one checksum file for everything published
        working-directory: dist
        run: sha256sum *.tar.gz *.AppImage *.zsync > SHA256SUMS
      - name: Show what would be published
        working-directory: dist
        run: ls -l
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.dry_run }}
        with:
          name: release-assets
          path: dist/
      # The tag goes on the tree the binaries were built from, and only now
      # that they pass: pushing it earlier would leave a tag with no release
      # behind on a failed run.
      - name: Push the release tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag '${{ needs.version.outputs.tag }}'
          git push origin 'tag ${{ needs.version.outputs.tag }}'
      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.zsync
            dist/SHA256SUMS
          generate_release_notes: true
