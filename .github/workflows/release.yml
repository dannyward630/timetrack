name: release

# Publishes the terminal client as statically linked `timetrack` binaries
# plus the desktop GUI as a self-contained AppImage bundling
# `timetrack-gui` and `timetrack-service` (see build-appimage.sh).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--workspace` builds timetrack-gui too, and gpui links the system
      # libraries below. Without them the test job fails at build time, which
      # reads as a broken test rather than a missing -dev package.
      - name: Install the GUI's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfreetype-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  lint:
    name: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Clippy builds the whole workspace including the GUI, so it needs the
      # same system libraries as the test job.
      - name: Install the GUI's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfreetype-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # `--all-targets` covers the test helpers too, where the last batch of
      # warnings lived. `-D warnings` makes any new one fail the build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      # `musl-tools` is the Debian/Ubuntu package name for the musl cross
      # toolchain. Deliberately NO CARGO_TARGET_*_LINKER override: rust's
      # default linker (rust-lld) for musl targets is what works. Some
      # distros' musl-gcc (GCC 16.x on Arch as of 2026-09) produces binaries
      # that segfault on anything that hashes -- std's HashMap, and therefore
      # zbus' D-Bus address parser. See .cargo/config.toml.
      - name: Install the musl cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked \
            --package timetrack-cli \
            --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/timetrack dist/timetrack-${{ matrix.arch }}
          tar -czf dist/timetrack-${{ matrix.arch }}.tar.gz -C dist timetrack-${{ matrix.arch }}
          rm dist/timetrack-${{ matrix.arch }}

      - name: Checksum
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Verify the binary is static and actually runs
        run: |
          BIN=dist/timetrack-${{ matrix.arch }}
          file "$BIN"
          # Zero NEEDED entries is what "static" means in practice.
          test "$(readelf -d "$BIN" | grep -c NEEDED)" = "0" \
            || { echo "::error::binary is dynamically linked"; exit 1; }
          # And it must not just link -- it must run. A broken linker can
          # produce a binary that segfaults immediately; `--version` touches
          # argument parsing and the hash map that zbus needs.
          "$BIN" --version

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

  appimage:
    name: TimeTrack-x86_64.AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # linuxdeploy bundles these from the build host into the image, but
      # building the GUI still needs their headers, same as the test job.
      - name: Install the GUI's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfreetype-dev libfontconfig-dev file
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the AppImage
        run: ./build-appimage.sh
      - name: Checksum
        run: |
          mkdir -p dist
          cp TimeTrack-x86_64.AppImage dist/
          (cd dist && sha256sum TimeTrack-x86_64.AppImage > TimeTrack-x86_64.AppImage.sha256)
      - name: Verify the AppImage bundles both binaries
        run: |
          ./TimeTrack-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/timetrack-gui
          test -x squashfs-root/usr/bin/timetrack-service
          test -x squashfs-root/AppRun
          rm -rf squashfs-root
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TimeTrack-x86_64.AppImage
            dist/TimeTrack-x86_64.AppImage.sha256
